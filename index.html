<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动动Go / MoveGo - Adventure</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="phone" aria-label="动动Go Adventure">
        <section class="screen">
          <header class="topbar app-header">
            <div>
              <h1>动动Go</h1>
              <p>今天不用很猛，动一下就算赢。</p>
            </div>
            <button class="avatar-button" aria-label="进入我的页">
              <img class="mascot-art mascot-art--small" src="./assets/mascot/dongdong-3d-avatar.png" alt="" aria-hidden="true" />
            </button>
          </header>

          <section class="user-card" aria-label="用户状态">
            <div class="mascot-badge">
              <img class="mascot-art mascot-art--card" src="./assets/mascot/dongdong-3d-base.png" alt="动动，戴绿色运动发带、背小水壶、穿运动鞋的小水豚" />
            </div>
            <div class="user-copy">
              <h2>Lina</h2>
              <p>Lv.5 · 青铜动能者</p>
              <div class="level-track" aria-hidden="true"><span></span></div>
              <div class="stat-row" aria-label="状态数据">
                <span><strong id="streakValue">3</strong> 连续 7 天</span>
                <span><strong id="xpValue">120</strong> XP</span>
              </div>
            </div>
          </section>

          <section class="chapter-heading" id="milestoneCard" aria-live="polite">
            <div>
              <h2>第 1 章：从 0 开始动起来</h2>
              <p id="milestoneTitle">再完成 1 关，解锁第一步勇士</p>
            </div>
            <span id="milestoneCount">0/5</span>
          </section>

          <section class="map-section" aria-labelledby="mapTitle">
            <div class="section-heading">
              <div>
                <h2 id="mapTitle">主线地图</h2>
              </div>
              <button class="reset-button" id="resetProgress" type="button">重置</button>
            </div>
            <ol class="adventure-map" id="adventureMap"></ol>
          </section>

          <section class="current-card" id="currentCard" aria-live="polite">
            <div class="current-card__meta">
              <p class="label" id="currentCode">1-1 当前关卡</p>
              <h2 id="currentTitle">下楼走一圈</h2>
              <p id="currentGoal">完成第一次低门槛运动</p>
              <div class="pill-row">
                <span id="currentDuration">5 分钟</span>
                <span id="currentType">步行启动</span>
                <span id="currentReward">20 XP</span>
              </div>
            </div>
            <button class="primary-action" id="startAdventure" type="button">开始</button>
          </section>
        </section>

        <nav class="bottom-nav" aria-label="底部导航">
          <button class="nav-item active" type="button" aria-current="page">
            <span aria-hidden="true">◇</span>
            冒险
          </button>
          <button class="nav-item" type="button">
            <span aria-hidden="true">↯</span>
            快练
          </button>
          <button class="nav-item" type="button">
            <span aria-hidden="true">✓</span>
            Quest
          </button>
          <button class="nav-item" type="button">
            <span aria-hidden="true">♢</span>
            锦标赛
          </button>
          <button class="nav-item" type="button">
            <span aria-hidden="true">＋</span>
            社区
          </button>
        </nav>
      </section>
    </main>

    <dialog class="complete-dialog" id="completeDialog">
      <div class="dialog-mascot">
        <img class="mascot-art mascot-art--dialog" src="./assets/mascot/dongdong-3d-cheer.png" alt="" aria-hidden="true" />
      </div>
      <p class="label">Quest Complete</p>
      <h2 id="dialogTitle">下楼走一圈完成</h2>
      <p id="dialogBody">获得 20 XP，下一关已解锁。</p>
      <button class="primary-action" id="closeDialog" type="button">继续闯关</button>
    </dialog>

    <script src="./script.js"></script>
  </body>
</html>
